<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Trainix Design System</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap">
<style>
/* Layout: a three-column workspace (navigation · canvas · inspector), like a design tool.
   Trainix is a light-only product, so this page commits to its light theme on purpose.
   Every Trainix token below is set live by the script from the draft library. */
:root{
  color-scheme: light;
  --font: "IBM Plex Sans", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
  --shadow-xs: 0 1px 2px rgba(0,0,0,.05);
  --shadow-sm: 0 1px 2px rgba(0,0,0,.06), 0 1px 3px rgba(0,0,0,.10);
  --shadow-md: 0 2px 4px -2px rgba(0,0,0,.06), 0 4px 8px -2px rgba(0,0,0,.10);
  --shadow-lg: 0 4px 6px -2px rgba(0,0,0,.03), 0 12px 16px -4px rgba(0,0,0,.08);
  --shadow-xl: 0 8px 8px -4px rgba(0,0,0,.03), 0 20px 24px -4px rgba(0,0,0,.08);
  --ring-brand: 0 0 0 4px var(--blue-100), var(--shadow-xs);
  --ring-gray: 0 0 0 4px var(--neutral-200), var(--shadow-xs);
  --ring-error: 0 0 0 4px var(--red-100), var(--shadow-xs);
  /* fallbacks before the script runs */
  --bg-primary:#FAFAFA; --bg-white:#FFFFFF; --text-primary:#171717; --border-secondary:#E5E5E5;
  --radius-xs:2px; --radius-sm:4px; --radius-md:6px; --radius-lg:8px; --radius-xl:12px; --radius-2xl:16px;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg-primary,#FAFAFA);color:var(--text-primary,#171717);font:400 14px/20px var(--font);-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg-white,#fff)}
button,input,select{font:inherit;color:inherit}
a{color:inherit}
.mono{font-family:var(--mono);font-size:12px;letter-spacing:0}
.num{font-variant-numeric:tabular-nums}
:focus-visible{outline:2px solid var(--border-brand);outline-offset:2px}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}

/* ---------- Shell ---------- */
.app{display:grid;grid-template-columns:248px minmax(0,1fr);height:100%}
.nav{background:var(--bg-primary);border-right:1px solid var(--border-secondary);display:flex;flex-direction:column;min-height:0;padding-left:max(12px,env(safe-area-inset-left,0px))}
.brand{display:flex;align-items:center;gap:10px;padding:16px 12px 16px 8px;height:64px}
.brand-mark{width:28px;height:28px;border-radius:8px;background:var(--bg-brand-solid);display:grid;place-items:center;color:#fff;font-weight:700;font-size:14px}
.brand-name{font-weight:600;font-size:16px;line-height:24px}
.brand-sub{font-size:12px;line-height:16px;color:var(--text-tertiary)}
.ver{margin-left:auto;font-family:var(--mono);font-size:11px;color:var(--text-tertiary);border:1px solid var(--border-secondary);background:var(--bg-white);border-radius:6px;padding:1px 6px}
.nav-scroll{overflow:auto;flex:1;padding:4px 12px 12px 0}
.nav-group{display:grid;gap:2px;margin-bottom:20px}
.nav-label{font-size:11px;line-height:16px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--text-placeholder);padding:0 10px 6px}
.nav a{display:flex;align-items:center;gap:10px;height:36px;padding:0 10px;border-radius:var(--radius-md);text-decoration:none;color:var(--text-tertiary);font-weight:500}
.nav a svg{width:18px;height:18px;color:var(--icon-secondary);flex:none}
.nav a:hover{background:var(--bg-secondary);color:var(--text-primary)}
.nav a[aria-current="page"]{background:var(--bg-secondary);color:var(--text-primary)}
.nav a .dot{margin-left:auto}
.nav .count{margin-left:auto;min-width:20px;height:20px;border-radius:999px;background:var(--bg-error-solid);color:#fff;font-size:11px;font-weight:600;display:grid;place-items:center;padding:0 6px}
.nav .count.ok{background:var(--bg-success-primary);color:var(--text-success-primary)}
.dot{width:7px;height:7px;border-radius:999px;background:var(--icon-success);flex:none}
.dot.warn{background:var(--icon-warning)}
.draft{margin:0 12px 16px 0;border:1px solid var(--border-secondary);background:var(--bg-white);border-radius:var(--radius-xl);padding:14px;display:grid;gap:10px}
.draft-head{display:flex;justify-content:space-between;align-items:center}
.draft-head span:first-child{font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--text-placeholder)}
.draft p{margin:0;font-size:12px;line-height:18px;color:var(--text-tertiary)}
.draft .actions{display:flex;gap:8px;flex-wrap:wrap}
.draft .actions .btn{flex:1 1 auto;min-width:0}
.draft-head{gap:8px}
.draft-head span{white-space:nowrap}

.main{display:flex;flex-direction:column;min-width:0;min-height:0}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;height:56px;display:flex;align-items:center;gap:12px;border-bottom:1px solid var(--border-secondary);background:var(--bg-white);padding-left:max(24px,env(safe-area-inset-left,0px));padding-right:max(24px,env(safe-area-inset-right,0px))}
.crumbs{display:flex;align-items:center;gap:8px;color:var(--text-placeholder);min-width:0}
.crumbs svg{width:14px;height:14px;color:var(--icon-tertiary)}
.crumbs b{color:var(--text-primary);font-weight:500;white-space:nowrap}
.top-right{margin-left:auto;display:flex;align-items:center;gap:8px}
.menu-btn{display:none}
.work{flex:1;display:grid;grid-template-columns:minmax(0,1fr) 320px;min-height:0}
.canvas{overflow:auto;padding-block:28px 64px;padding-left:max(32px,env(safe-area-inset-left,0px));padding-right:32px;min-width:0}
.inspector{border-left:1px solid var(--border-secondary);background:var(--bg-white);overflow:auto;padding:24px 20px 48px;padding-right:max(20px,env(safe-area-inset-right,0px));display:grid;align-content:start;gap:24px}
.page-head{display:flex;gap:16px;align-items:flex-start;justify-content:space-between;flex-wrap:wrap;margin-bottom:20px}
.page-head h1{margin:0 0 4px;font-size:30px;line-height:38px;font-weight:600;letter-spacing:-.01em;text-wrap:balance}
.page-head p{margin:0;color:var(--text-tertiary);max-width:62ch}
.meta{display:flex;gap:16px;align-items:center;color:var(--text-tertiary);font-size:13px;flex-wrap:wrap}
.meta b{color:var(--text-primary);font-weight:600}
.chip{display:inline-flex;align-items:center;gap:6px;font-family:var(--mono);font-size:11.5px;color:var(--text-secondary);background:var(--bg-primary_hover);border-radius:6px;padding:2px 8px}
.sec-label{display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin:28px 0 10px;font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--text-placeholder)}
.sec-label span:last-child{text-transform:none;letter-spacing:0;font-weight:400;font-size:12px}
.card{background:var(--bg-white);border:1px solid var(--border-secondary);border-radius:var(--radius-xl)}

/* stage */
.stage{position:relative;min-height:260px;display:grid;place-items:center;padding:56px 24px;background-color:var(--bg-white);background-image:radial-gradient(var(--neutral-200) 1px,transparent 1px);background-size:16px 16px;border:1px solid var(--border-secondary);border-radius:var(--radius-xl)}
.stage-tag{position:absolute;top:12px;left:12px}
.stage-foot{position:absolute;bottom:10px;right:14px;font-family:var(--mono);font-size:11px;color:var(--text-placeholder)}
.stage-inner{display:grid;justify-items:center;gap:16px;width:100%}

/* matrix */
.scroll-x{overflow-x:auto}
table.matrix{width:100%;border-collapse:collapse;min-width:640px}
.matrix th{font-size:12px;font-weight:500;color:var(--text-placeholder);padding:10px 8px;text-align:center;border-bottom:1px solid var(--border-secondary)}
.matrix th:first-child,.matrix td:first-child{text-align:left;padding-left:16px;width:150px;color:var(--text-secondary);font-weight:500}
.matrix td{padding:10px 8px;text-align:center;border-bottom:1px solid var(--border-secondary);vertical-align:middle}
.matrix tr:last-child td{border-bottom:0}
.cell{display:inline-grid;place-items:center;min-height:44px;min-width:60px;padding:8px 10px;border-radius:10px;border:1.5px solid transparent;cursor:pointer;background:none;vertical-align:middle}
.cell-in{display:inline-grid;place-items:center}
.cell:hover{background:var(--bg-primary)}
.cell.sel{border-color:var(--border-brand);background:var(--bg-brand-primary)}
.cell > *{pointer-events:none}

/* inspector controls */
.field{display:grid;gap:8px}
.field-label{display:flex;justify-content:space-between;font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--text-placeholder)}
.field-label span:last-child{letter-spacing:0;text-transform:none;font-weight:500;color:var(--text-secondary)}
.seg{display:flex;flex-wrap:wrap;gap:4px;background:var(--bg-primary_hover);border-radius:var(--radius-lg);padding:3px}
.seg button{flex:1 1 auto;border:0;background:none;border-radius:6px;padding:5px 10px;font-size:13px;font-weight:500;color:var(--text-tertiary);cursor:pointer;white-space:nowrap}
.seg button:hover{color:var(--text-primary)}
.seg button[aria-pressed="true"]{background:var(--bg-white);color:var(--text-primary);box-shadow:var(--shadow-sm)}
.text-input{height:40px;width:100%;border:1px solid var(--border-primary);border-radius:var(--radius-lg);padding:0 12px;background:var(--bg-white);box-shadow:var(--shadow-xs)}
.text-input:focus{outline:none;border-color:var(--border-brand-subtle);box-shadow:var(--ring-brand)}
.hint{font-size:12px;line-height:18px;color:var(--text-tertiary)}
.code{position:relative;background:#141414;color:#E5E5E5;border-radius:var(--radius-xl);padding:14px 16px;font-family:var(--mono);font-size:12px;line-height:20px;white-space:pre;overflow-x:auto}
.code .k{color:#93B8FD}.code .s{color:#BBF7D0}.code .a{color:#FDBA74}
.copy{position:absolute;top:8px;right:8px;border:1px solid #333;background:#1f1f1f;color:#D4D4D4;border-radius:6px;font-size:11px;padding:2px 8px;cursor:pointer;font-family:var(--font)}
.copy:hover{background:#2a2a2a}
.kv{display:grid;gap:8px}
.kv div{display:grid;grid-template-columns:72px 1fr auto;gap:8px;align-items:center;font-size:12px}
.kv dt,.kv .k1{color:var(--text-placeholder);font-family:var(--mono)}
.kv .v1{font-family:var(--mono);color:var(--text-primary);text-align:right;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sw{width:14px;height:14px;border-radius:4px;border:1px solid rgba(0,0,0,.08);display:inline-block;flex:none}
hr.div{border:0;border-top:1px solid var(--border-secondary);margin:0}

/* range */
input[type=range]{width:100%;accent-color:var(--bg-brand-solid);height:20px;margin:0}
.range-hue{-webkit-appearance:none;appearance:none;height:8px;border-radius:999px;background:linear-gradient(90deg,#f00,#ff0,#0f0,#0ff,#00f,#f0f,#f00)}
.range-track{-webkit-appearance:none;appearance:none;height:8px;border-radius:999px}
.range-hue::-webkit-slider-thumb,.range-track::-webkit-slider-thumb{-webkit-appearance:none;width:18px;height:18px;border-radius:999px;background:#fff;border:1px solid var(--border-primary);box-shadow:var(--shadow-md);cursor:pointer}
.range-hue::-moz-range-thumb,.range-track::-moz-range-thumb{width:18px;height:18px;border-radius:999px;background:#fff;border:1px solid var(--border-primary);box-shadow:var(--shadow-md);cursor:pointer}

/* callouts */
.callout{border-radius:var(--radius-xl);padding:14px 16px;display:grid;gap:6px;font-size:13px}
.callout.bad{background:var(--bg-error-primary);color:var(--text-error-primary)}
.callout.good{background:var(--bg-success-primary);color:var(--text-success-primary)}
.callout b{font-weight:600}
.callout p{margin:0;color:var(--text-secondary)}
.callout a{font-weight:500;color:var(--text-primary)}

/* ---------- Trainix components (all driven by tokens) ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid transparent;border-radius:var(--radius-lg);height:40px;padding:0 16px;font:600 14px/20px var(--font);white-space:nowrap;cursor:pointer;box-shadow:var(--shadow-xs);transition:background-color .12s,color .12s,box-shadow .12s;text-decoration:none}
.btn svg{width:20px;height:20px;flex:none}
.btn-xs{height:28px;padding:0 10px;gap:4px;font:500 12px/18px var(--font)}.btn-xs svg{width:16px;height:16px}
.btn-sm{height:36px;padding:0 14px}
.btn-md{height:40px;padding:0 16px}
.btn-lg{height:44px;padding:0 18px;font-size:16px;line-height:24px}
.btn-xl{height:48px;padding:0 20px;font-size:16px;line-height:24px}
.btn:disabled{cursor:not-allowed}
.btn:focus-visible{outline:none}
.h-primary{background:var(--bg-brand-solid);border-color:var(--bg-brand-solid);color:var(--text-primary_on-brand)}
.h-primary:not(:disabled):hover,.h-primary.is-hover{background:var(--bg-brand-solid_hover);border-color:var(--bg-brand-solid_hover)}
.h-primary:focus-visible,.h-primary.is-focus{box-shadow:var(--ring-brand)}
.h-primary:disabled{background:var(--bg-brand-tertiary);border-color:var(--bg-brand-tertiary)}
.h-secondary-color{background:var(--bg-brand-primary);border-color:var(--bg-brand-primary);color:var(--text-brand-primary)}
.h-secondary-color:not(:disabled):hover,.h-secondary-color.is-hover{background:var(--bg-brand-secondary);border-color:var(--bg-brand-secondary);color:var(--text-brand-primary-hover)}
.h-secondary-color:focus-visible,.h-secondary-color.is-focus{border-color:var(--border-brand-subtle);box-shadow:var(--ring-brand)}
.h-secondary-color:disabled{background:color-mix(in srgb,var(--bg-brand-primary) 70%,transparent);border-color:transparent;color:var(--text-brand-secondary)}
.h-secondary{background:var(--bg-white);border-color:var(--border-primary);color:var(--text-secondary)}
.h-secondary:not(:disabled):hover,.h-secondary.is-hover{background:var(--bg-primary_hover);color:var(--text-primary)}
.h-secondary:focus-visible,.h-secondary.is-focus{box-shadow:var(--ring-gray)}
.h-secondary:disabled{border-color:var(--border-secondary);color:var(--text-disabled)}
.h-tertiary-color,.h-tertiary,.h-link-color,.h-link-gray{background:transparent;box-shadow:none}
.h-tertiary-color{color:var(--text-brand-primary)}
.h-tertiary-color:not(:disabled):hover,.h-tertiary-color.is-hover{background:var(--bg-brand-secondary);color:var(--text-brand-primary-hover)}
.h-tertiary-color:focus-visible,.h-tertiary-color.is-focus{background:var(--bg-brand-primary);border-color:var(--border-brand-subtle);box-shadow:var(--ring-brand)}
.h-tertiary{color:var(--text-secondary)}
.h-tertiary:not(:disabled):hover,.h-tertiary.is-hover{background:var(--bg-secondary);color:var(--text-primary)}
.h-tertiary:focus-visible,.h-tertiary.is-focus{background:var(--bg-white);border-color:var(--border-primary);box-shadow:var(--ring-gray)}
.h-tertiary-color:disabled,.h-tertiary:disabled,.h-link-color:disabled,.h-link-gray:disabled{color:var(--text-disabled)}
.h-link-color,.h-link-gray{height:auto!important;padding:0 2px!important;border-radius:4px}
.h-link-color{color:var(--text-brand-primary)}
.h-link-color:not(:disabled):hover,.h-link-color.is-hover{color:var(--text-brand-primary-hover)}
.h-link-color:focus-visible,.h-link-color.is-focus{background:var(--bg-brand-primary);border-color:var(--border-brand-subtle)}
.h-link-gray{color:var(--text-secondary)}
.h-link-gray:not(:disabled):hover,.h-link-gray.is-hover{color:var(--text-primary)}
.h-link-gray:focus-visible,.h-link-gray.is-focus{background:var(--bg-white);border-color:var(--border-primary)}
.h-primary-destructive{background:var(--bg-error-solid);border-color:var(--bg-error-solid);color:var(--text-primary_on-brand)}
.h-primary-destructive:not(:disabled):hover,.h-primary-destructive.is-hover{background:var(--bg-error-solid_hover);border-color:var(--bg-error-solid_hover)}
.h-primary-destructive:focus-visible,.h-primary-destructive.is-focus{box-shadow:var(--ring-error)}
.h-primary-destructive:disabled{background:var(--bg-error-tertiary);border-color:var(--bg-error-tertiary)}
.h-secondary-destructive{background:var(--bg-error-primary);border-color:var(--bg-error-primary);color:var(--text-error-primary)}
.h-secondary-destructive:not(:disabled):hover,.h-secondary-destructive.is-hover{background:var(--bg-error-secondary);border-color:var(--bg-error-secondary);color:var(--text-error-primary-hover)}
.h-secondary-destructive:focus-visible,.h-secondary-destructive.is-focus{border-color:var(--border-error-subtle);box-shadow:var(--ring-error)}
.h-secondary-destructive:disabled{color:var(--text-error-secondary)}
.spin{width:16px;height:16px;border-radius:999px;border:2px solid currentColor;border-right-color:transparent;animation:spin .8s linear infinite;flex:none;opacity:.9}
.btn-lg .spin,.btn-xl .spin{width:18px;height:18px}
.btn-xs .spin{width:12px;height:12px}
@keyframes spin{to{transform:rotate(360deg)}}

/* input */
.inp{display:grid;gap:6px;width:320px;max-width:100%;text-align:left}
.inp label,.inp .lbl{font-size:14px;line-height:20px;font-weight:500;color:var(--text-secondary)}
.inp-box{display:flex;align-items:center;gap:8px;height:44px;padding:0 14px;border:1px solid var(--border-primary);border-radius:var(--radius-lg);background:var(--bg-white);box-shadow:var(--shadow-xs)}
.inp-box svg{width:20px;height:20px;color:var(--icon-primary);flex:none}
.inp-box input{border:0;outline:0;background:none;flex:1;min-width:0;font-size:16px;line-height:24px;color:var(--text-primary);padding:0}
.inp-box input::placeholder{color:var(--text-placeholder)}
.inp-box .val{flex:1;font-size:16px;line-height:24px;color:var(--text-primary);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.inp-box .ph{color:var(--text-placeholder)}
.inp-box:focus-within,.inp-box.is-focus{border-color:var(--border-brand-subtle);box-shadow:var(--ring-brand)}
.inp-box.is-disabled{background:var(--bg-secondary)}.inp-box.is-disabled .val{color:var(--text-placeholder)}
.inp-box.is-error{border-color:var(--border-error-subtle)}
.inp-box.is-error.is-focus,.inp-box.is-error:focus-within{box-shadow:var(--ring-error)}
.inp-box .err-ic{color:var(--icon-error);width:16px;height:16px}
.inp .hnt{font-size:14px;line-height:20px;color:var(--text-tertiary)}
.inp .hnt.err{color:var(--text-error-primary)}
.inp.mini{width:200px}
.inp.mini .inp-box{height:36px;padding:0 10px}
.inp.mini .val{font-size:13px}
/* select */
.sel-menu{border:1px solid var(--border-secondary);border-radius:var(--radius-lg);background:var(--bg-white);box-shadow:var(--shadow-lg);padding:4px 0;width:100%}
.sel-item{display:flex;align-items:center;gap:8px;height:44px;padding:0 14px;font-size:16px;font-weight:500;color:var(--text-secondary)}
.sel-item.on{background:var(--bg-primary_hover);color:var(--text-primary)}
.sel-item svg{margin-left:auto;width:20px;height:20px;color:var(--icon-brand)}
.inp-box .chev{color:var(--icon-secondary);margin-left:auto}
.inp-box .val.med{font-weight:500}
/* checkbox / radio / toggle */
.ctl{display:inline-flex;align-items:flex-start;gap:8px;text-align:left;cursor:pointer}
.ctl-label{font-size:14px;line-height:20px;font-weight:500;color:var(--text-secondary)}
.box{width:20px;height:20px;border:1px solid var(--border-primary);background:var(--bg-white);border-radius:6px;display:grid;place-items:center;flex:none;color:var(--text-brand-primary);transition:background-color .12s}
.box.sm{width:16px;height:16px;border-radius:4px}
.box svg{width:14px;height:14px;stroke-width:3}
.box.sm svg{width:11px;height:11px}
.box.radio,.box.circle{border-radius:999px}
.box.on{border-color:var(--bg-brand-solid)}
.box.radio.on::after{content:"";width:10px;height:10px;border-radius:999px;background:var(--bg-brand-solid)}
.box.radio.sm.on::after{width:8px;height:8px}
.box.circle.on{background:var(--bg-brand-solid);color:#fff}
.box.is-hover{background:var(--bg-brand-primary);border-color:var(--bg-brand-solid)}
.box.circle.on.is-hover{background:var(--bg-brand-solid)}
.box.is-focus{box-shadow:var(--ring-brand)}
.box.is-focus:not(.on){border-color:var(--border-brand)}
.box.is-disabled{background:var(--bg-primary_hover);border-color:var(--border-secondary);color:var(--neutral-300)}
.box.radio.on.is-disabled::after{background:var(--neutral-300);width:8px;height:8px}
.box.circle.on.is-disabled{background:var(--bg-secondary);color:#fff}
.tg{width:44px;height:24px;border-radius:999px;background:var(--bg-secondary);padding:2px;display:flex;flex:none;transition:background-color .15s}
.tg.sm{width:36px;height:20px}
.tg::after{content:"";width:20px;height:20px;border-radius:999px;background:#fff;box-shadow:var(--shadow-sm);transition:transform .15s}
.tg.sm::after{width:16px;height:16px}
.tg.on{background:var(--bg-brand-solid)}
.tg.on::after{transform:translateX(20px)}
.tg.sm.on::after{transform:translateX(16px)}
.tg.is-hover:not(.on){background:var(--bg-tertiary)}
.tg.is-focus{box-shadow:var(--ring-brand)}
.tg.is-disabled{background:var(--bg-primary_hover)}.tg.is-disabled::after{background:var(--bg-primary);box-shadow:none}
/* badge */
.badge{display:inline-flex;align-items:center;gap:4px;height:22px;padding:0 8px;border-radius:999px;font-size:12px;line-height:18px;font-weight:500;white-space:nowrap}
.badge svg{width:14px;height:14px}
.badge.md{height:26px;padding:0 10px;font-size:14px;line-height:20px}.badge.md svg{width:16px;height:16px}
.badge .bd{width:6px;height:6px;border-radius:999px;background:currentColor}
.b-brand{background:var(--bg-brand-primary);color:var(--text-brand-primary)}
.b-gray{background:var(--bg-primary_hover);color:var(--text-secondary)}
.b-error{background:var(--bg-error-secondary);color:var(--text-error-primary)}
.b-success{background:var(--bg-success-primary);color:var(--text-success-primary)}
.b-warning{background:var(--bg-warning-primary);color:var(--text-warning-primary)}
.b-purple{background:var(--bg-utility-purple);color:var(--text-utility-purple)}
.b-outline{border:1px solid var(--border-secondary);color:var(--text-primary)}
.b-ghost{color:var(--text-primary)}
/* tabs */
.tabs{display:flex;gap:4px;flex-wrap:wrap}
.tab{display:inline-flex;align-items:center;gap:6px;height:28px;padding:0 10px;border-radius:var(--radius-lg);border:1px solid transparent;background:none;font-size:14px;font-weight:500;color:var(--text-placeholder);cursor:pointer;position:relative}
.tab svg{width:16px;height:16px}
.tab:hover,.tab.is-hover{color:var(--text-primary)}
.tabs.pill{background:var(--bg-primary_hover);padding:3px;border-radius:10px}
.pill .tab.on{background:var(--bg-white);color:var(--text-primary);box-shadow:var(--shadow-sm)}
.underline .tab.on{color:var(--text-brand-primary)}
.underline .tab.on::after{content:"";position:absolute;left:0;right:0;bottom:-5px;height:1px;background:var(--bg-brand-solid)}
.tab.is-focus{background:var(--bg-white);border-color:var(--border-brand-subtle);box-shadow:var(--ring-brand);color:var(--text-primary)}
.tab:disabled,.tab.is-disabled{opacity:.5;cursor:not-allowed}
.tab .badge{height:18px;padding:0 6px;font-size:11px}
/* toast */
.toast{width:382px;max-width:100%;display:flex;gap:12px;align-items:center;padding:16px;border:1px solid var(--border-secondary);border-radius:var(--radius-2xl);background:var(--bg-white);box-shadow:var(--shadow-lg);text-align:left}
.toast .ti{width:16px;height:16px;flex:none;display:grid}
.toast .ti svg{width:16px;height:16px}
.toast .tb{flex:1;display:grid;gap:4px;min-width:0}
.toast .tt{font-size:14px;line-height:20px;font-weight:500;color:var(--text-primary)}
.toast .td{font-size:12px;line-height:18px;color:var(--text-placeholder)}
.toast .tt + .td{}
.toast .tx{width:20px;height:20px;color:var(--icon-tertiary);border:0;background:none;padding:0;cursor:pointer;flex:none}
.toast .tx svg{width:20px;height:20px}
.toast .btn{flex:none}
.toast.mini{width:auto;min-width:180px;padding:10px;gap:8px;border-radius:12px}
.toast.mini .td,.toast.mini .tt{font-size:11px;line-height:15px}
.toast.mini .btn{height:22px;font-size:10px;padding:0 6px;margin-top:4px}
.ic-success{color:var(--icon-primary)}.ic-info{color:var(--icon-primary)}.ic-warning{color:var(--icon-primary)}.ic-error{color:var(--icon-error)}
#toasts{position:fixed;right:max(20px,calc(env(safe-area-inset-right,0px) + 16px));bottom:max(20px,calc(env(safe-area-inset-bottom,0px) + 16px));display:grid;gap:8px;z-index:50;max-width:calc(100vw - 32px)}
#toasts .toast{animation:tin .2s ease-out}
@keyframes tin{from{transform:translateY(8px);opacity:.4}}

/* textarea */
.inp-box.ta{height:128px;align-items:flex-start;padding:10px 14px}
.inp-box.ta .val{white-space:normal}
/* dropdown */
.dd{width:240px;border:1px solid var(--border-secondary);border-radius:var(--radius-lg);background:var(--bg-white);box-shadow:var(--shadow-lg);padding:2px 0;text-align:left}
.dd-head{display:flex;gap:12px;align-items:center;padding:10px 16px;border-bottom:1px solid var(--border-secondary)}
.dd-head b{display:block;font-size:14px;line-height:20px;font-weight:600;color:var(--text-primary)}
.dd-head span:not(.av){font-size:13px;color:var(--text-tertiary)}
.dd-item{display:flex;align-items:center;gap:12px;height:40px;padding:0 16px;font-size:14px;font-weight:500;color:var(--text-secondary);margin:2px 0}
.dd-item svg{width:16px;height:16px;color:var(--icon-secondary);stroke-width:1.5}
.dd-item.is-hover{background:var(--bg-primary_hover)}
.dd-item.is-disabled{color:var(--text-disabled)}.dd-item.is-disabled svg{color:var(--icon-disabled)}
.dd-item.danger{color:var(--text-error-primary)}.dd-item.danger svg{color:var(--icon-error)}
.dd-sep{height:1px;background:var(--border-secondary);margin:2px 0}
/* avatar */
.av{width:28px;height:28px;border-radius:999px;background:var(--bg-brand-primary);color:var(--text-brand-primary);display:inline-grid;place-items:center;font-size:12px;font-weight:500;flex:none}
.av.sm{width:24px;height:24px;font-size:10px}
.av.lg{width:40px;height:40px;font-size:14px}
.av-group{display:flex}.av-group .av{border:2px solid var(--bg-white);margin-left:-8px;box-sizing:content-box}.av-group .av:first-child{margin-left:0}
.av-wrap{display:inline-flex;align-items:center;gap:10px;text-align:left}
.av-wrap b{display:block;font-size:14px;font-weight:500;color:var(--text-primary)}
.av-wrap small{display:block;font-size:12px;color:var(--text-tertiary)}
/* breadcrumbs */
.bc{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--text-placeholder);flex-wrap:wrap}
.bc svg{width:14px;height:14px;color:var(--icon-secondary)}
.bc a{text-decoration:none;color:var(--text-placeholder)}
.bc a:hover,.bc a.is-hover{color:var(--text-primary)}
.bc .cur{color:var(--text-primary)}
.bc .more{border:0;background:none;padding:0 2px;color:var(--icon-primary);cursor:pointer;display:inline-flex}
/* pagination */
.pg{display:flex;align-items:center;justify-content:flex-end;gap:16px;width:100%;flex-wrap:wrap}
.pg-nums{display:flex;gap:2px}
.pg-n{width:40px;height:40px;border-radius:var(--radius-lg);display:grid;place-items:center;font-size:14px;font-weight:500;color:var(--text-placeholder);border:0;background:none;cursor:pointer}
.pg-n:hover,.pg-n.on{background:var(--bg-brand-primary);color:var(--text-brand-primary)}
.pg-b{height:40px;display:inline-flex;align-items:center;gap:8px;padding:0 16px;border:1px solid var(--border-secondary);border-radius:var(--radius-lg);background:var(--bg-white);font-size:14px;font-weight:600;color:var(--text-primary);cursor:pointer}
.pg-b svg{width:20px;height:20px;color:var(--icon-secondary)}
.pg-b:not(:disabled):hover{background:var(--bg-primary_hover);border-color:var(--border-primary)}
.pg-b:disabled{color:var(--text-disabled);cursor:not-allowed}.pg-b:disabled svg{color:var(--icon-disabled)}
.pg.mini{width:auto;gap:6px}.pg.mini .pg-b{height:26px;padding:0 6px}.pg.mini .pg-b svg{width:14px;height:14px}
/* inline alert */
.ia{display:flex;gap:12px;align-items:flex-start;padding:14px 16px;border-radius:var(--radius-xl);border:1px solid;width:440px;max-width:100%;text-align:left;font-size:14px;line-height:20px}
.ia > svg{width:20px;height:20px;flex:none}
.ia b{display:block;font-weight:600;color:var(--text-primary)}
.ia p{margin:2px 0 0;color:var(--text-secondary)}
.ia-info{background:var(--bg-brand-primary);border-color:var(--border-brand-subtle)}.ia-info > svg{color:var(--icon-brand)}
.ia-success{background:var(--bg-success-primary);border-color:color-mix(in srgb,var(--icon-success) 30%,transparent)}.ia-success > svg{color:var(--icon-success)}
.ia-warning{background:var(--bg-warning-primary);border-color:var(--border-warning-subtle)}.ia-warning > svg{color:var(--icon-warning)}
.ia-error{background:var(--bg-error-primary);border-color:var(--border-error-subtle)}.ia-error > svg{color:var(--icon-error)}
.ia.mini{width:150px;padding:8px 10px;font-size:11px;line-height:15px;gap:6px;font-weight:500}.ia.mini > svg{width:14px;height:14px}
/* empty state */
.es{width:440px;max-width:100%;border:1px solid var(--border-secondary);border-radius:var(--radius-2xl);background:color-mix(in srgb,var(--bg-primary_hover) 30%,var(--bg-white));padding:32px 24px;display:grid;justify-items:center;gap:12px;text-align:center}
.es.panel{padding:20px;gap:8px}
.es-ic{width:40px;height:40px;border-radius:var(--radius-lg);background:var(--bg-primary_hover);display:grid;place-items:center}
.es-ic svg{width:18px;height:18px;color:var(--icon-primary)}
.es b{font-size:16px;line-height:24px;font-weight:600;color:var(--text-primary)}
.es p{margin:-8px 0 4px;font-size:14px;color:var(--text-tertiary);max-width:320px}
.es.mini{width:140px;padding:12px;gap:6px}.es.mini b{font-size:11px;line-height:14px}.es.mini .es-ic{width:24px;height:24px}.es.mini .es-ic svg{width:12px;height:12px}
/* skeleton */
.sk{display:block;background:var(--bg-secondary);border-radius:6px;position:relative;overflow:hidden;flex:none}
.sk::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,transparent,rgba(255,255,255,.65),transparent);transform:translateX(-100%);animation:shimmer 1.4s infinite}
.still .sk::after{display:none}
@keyframes shimmer{to{transform:translateX(100%)}}
.sk-card{border:1px solid var(--border-secondary);border-radius:var(--radius-xl);background:var(--bg-white);padding:20px;display:grid;gap:12px}
/* modal demo */
.modal.demo{border:1px solid var(--border-secondary);text-align:left}
.md-ic{width:48px;height:48px;border-radius:999px;display:grid;place-items:center;margin-bottom:8px}
.md-ic svg{width:24px;height:24px}
.md-ic.err{background:var(--bg-error-secondary);color:var(--icon-error)}
.md-ic.brand{background:var(--bg-brand-secondary);color:var(--icon-brand)}
.modal.mini{width:150px;padding:10px;gap:4px;border-radius:10px;box-shadow:var(--shadow-md);border:1px solid var(--border-secondary);text-align:left}
.modal.mini h2{font-size:11px;line-height:14px}
.modal.mini .actions{margin-top:6px;gap:4px}
.modal.mini .btn{height:22px;font-size:10px;padding:0 4px;gap:3px}
.modal.mini .spin{width:9px;height:9px;border-width:1.5px}
/* tooltip */
.tt-wrap{display:inline-grid;justify-items:center;gap:10px}
.tip{background:var(--neutral-900);color:#fff;font-size:12px;line-height:18px;font-weight:500;padding:8px 12px;border-radius:var(--radius-md);box-shadow:var(--shadow-lg);max-width:260px;text-align:left;position:relative}
.tip small{display:block;font-weight:400;font-size:12px;color:var(--neutral-300);margin-top:2px}
.tip::after{content:"";position:absolute;left:50%;bottom:-4px;width:8px;height:8px;background:inherit;transform:translateX(-50%) rotate(45deg)}
.tip.light{background:var(--bg-white);color:var(--text-primary);border:1px solid var(--border-secondary)}
.tip.light small{color:var(--text-tertiary)}
.tip.light::after{border-right:1px solid var(--border-secondary);border-bottom:1px solid var(--border-secondary);bottom:-5px}
.help{width:16px;height:16px;color:var(--icon-tertiary)}
/* progress */
.pb{width:320px;max-width:100%;display:grid;gap:8px;text-align:left}
.pb-top{display:flex;justify-content:space-between;font-size:14px;font-weight:500;color:var(--text-secondary)}
.pb-track{height:8px;border-radius:999px;background:var(--bg-secondary);overflow:hidden}
.pb-fill{height:100%;border-radius:999px;background:var(--bg-brand-solid)}
.pb.mini{width:110px;gap:4px}.pb.mini .pb-top{font-size:11px}.pb.mini .pb-track{height:6px}
/* data table */
.dt-wrap{position:relative;width:100%;border:1px solid var(--border-secondary);border-radius:var(--radius-xl);background:var(--bg-white);overflow:hidden;text-align:left;box-shadow:var(--shadow-xs)}
.dt-bar{display:flex;align-items:center;gap:8px 12px;padding:16px 20px;flex-wrap:wrap}
.dt-bar h3{margin:0;font-size:18px;line-height:28px;font-weight:600}
.dt-bar .end{margin-left:auto;display:flex;gap:8px}
.dt-tools{display:flex;gap:8px;align-items:center;padding:0 20px 16px;flex-wrap:wrap}
.chipf{display:inline-flex;align-items:center;gap:6px;height:36px;padding:0 12px;border:1px solid var(--border-primary);border-radius:var(--radius-lg);background:var(--bg-white);font-size:14px;font-weight:500;color:var(--text-secondary);box-shadow:var(--shadow-xs)}
.chipf svg{width:16px;height:16px;color:var(--icon-tertiary)}
.dt{width:100%;border-collapse:collapse;min-width:760px}
.dt th{position:relative;height:44px;padding:0 16px;font-size:12px;font-weight:500;color:var(--text-tertiary);text-align:left;background:var(--bg-primary);border-top:1px solid var(--border-secondary);border-bottom:1px solid var(--border-secondary);white-space:nowrap}
.dt th button,.dt td .selbtn{border:0;background:none;padding:0;font:inherit;color:inherit;display:inline-flex;align-items:center;gap:4px;cursor:pointer}
.dt th svg{width:12px;height:12px}
.dt td{height:72px;padding:0 16px;border-bottom:1px solid var(--border-secondary);font-size:14px;color:var(--text-tertiary);white-space:nowrap}
.dt.compact td{height:48px}
.dt.compact .av.lg{width:28px;height:28px;font-size:12px}
.dt .acts{display:flex;gap:4px;justify-content:flex-end}
.dt .w2{width:96px}
.dt th .hd{display:inline-flex;align-items:center;gap:12px}
.dt th .hd svg{width:14px;height:14px;color:var(--icon-tertiary)}
.sel-item svg.li{margin-left:0;color:var(--icon-secondary)}
.sel-item .badge svg{margin-left:0}
.sp-bar{display:block;height:18px;background:var(--bg-brand-primary);color:var(--text-brand-primary);font-family:var(--mono);font-size:10px;line-height:18px;padding-left:3px;border-radius:2px;white-space:nowrap;min-width:4px}
.tok.sp td{height:40px}
.dt.compact .who span.sub{display:none}
.dt tbody tr:last-child td{border-bottom:0}
.dt tbody tr:hover td{background:var(--bg-primary)}
.dt tr.sel td{background:var(--bg-brand-primary)}
.dt .who{display:flex;align-items:center;gap:12px}
.dt .who b{display:block;font-weight:500;color:var(--text-primary)}
.dt .who span.sub{display:block;font-size:12px;line-height:16px}
.dt .w1{width:44px;padding-right:0}
.dt .rowmenu{border:0;background:none;width:32px;height:32px;border-radius:var(--radius-md);display:grid;place-items:center;color:var(--icon-tertiary);cursor:pointer}
.dt .rowmenu:hover{background:var(--bg-primary_hover)}.dt .rowmenu svg{width:18px;height:18px}
.dt-foot{border-top:1px solid var(--border-secondary);padding:12px 20px 16px}
.bulk{position:absolute;left:50%;bottom:16px;transform:translateX(-50%);display:flex;align-items:center;gap:8px;background:var(--neutral-900);color:#fff;border-radius:var(--radius-xl);padding:8px 8px 8px 16px;box-shadow:var(--shadow-xl);font-size:14px;font-weight:500;white-space:nowrap;z-index:2}
.bulk .btn{height:32px;padding:0 12px;background:#262626;border:1px solid #404040;color:#fff;box-shadow:none;font-size:13px}
.bulk .btn:hover{background:#333}
.bulk .btn svg{width:16px;height:16px}
.dt-empty{padding:32px 16px;display:grid;place-items:center}
.stage.wide{padding:20px;display:block;min-height:0;place-items:initial}
.stage.wide .stage-tag{position:static;margin-bottom:14px;display:inline-flex}
.stage.wide .stage-foot{position:static;display:block;text-align:right;margin-top:10px}
.stage.wide .stage-inner{display:block}
.anat{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px}
.anat div{border:1px solid var(--border-secondary);border-radius:var(--radius-xl);background:var(--bg-white);padding:14px 16px;font-size:13px;color:var(--text-tertiary)}
.anat b{display:block;color:var(--text-primary);font-weight:600;margin-bottom:2px;font-size:14px}
.dot.codeonly{background:var(--icon-brand)}
.status-note{margin-top:6px!important;font-size:13px;color:var(--text-placeholder)!important}
.nav-search{padding:0 12px 12px 0}
.nav-search .text-input{height:36px;font-size:13px}
.nav-empty{padding:4px 10px;font-size:13px;color:var(--text-placeholder)}

/* ---------- Overview, typography, guidelines, usage ---------- */
.hero{display:grid;gap:14px;padding:8px 0 8px;max-width:760px}
.eyebrow{font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--text-brand-primary)}
.hero h1{margin:0;font-size:36px;line-height:44px;font-weight:600;letter-spacing:-.015em;text-wrap:balance}
.hero p{margin:0;font-size:16px;line-height:24px;color:var(--text-tertiary);max-width:62ch}
.hero .row{display:flex;gap:12px;flex-wrap:wrap;margin-top:6px}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-top:24px}
.stat{background:var(--bg-white);border:1px solid var(--border-secondary);border-radius:var(--radius-xl);padding:16px 18px;display:grid;gap:2px}
.stat b{font-size:30px;line-height:38px;font-weight:600;font-variant-numeric:tabular-nums}
.stat span{font-size:13px;color:var(--text-tertiary)}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
.tile{display:grid;gap:6px;align-content:start;background:var(--bg-white);border:1px solid var(--border-secondary);border-radius:var(--radius-xl);padding:16px 18px;text-decoration:none;color:inherit;transition:border-color .12s,box-shadow .12s}
.tile:hover{border-color:var(--border-primary);box-shadow:var(--shadow-sm)}
.tile svg{width:20px;height:20px;color:var(--icon-brand)}
.tile b{font-size:15px;font-weight:600}
.tile span{font-size:13px;color:var(--text-tertiary)}
.princ{display:grid}
.pr{display:grid;grid-template-columns:36px minmax(0,1.1fr) minmax(0,1fr) minmax(0,1fr);gap:16px;padding:14px 18px;border-bottom:1px solid var(--border-secondary);font-size:13px;align-items:start}
.pr:last-child{border-bottom:0}
.pr .n{font-family:var(--mono);font-size:12px;color:var(--text-placeholder);padding-top:1px}
.pr b{font-size:14px;font-weight:600;color:var(--text-primary)}
.pr .d,.pr .x{display:flex;gap:6px;color:var(--text-secondary)}
.pr .d svg,.pr .x svg{width:14px;height:14px;flex:none;margin-top:3px}
.pr .d svg{color:var(--icon-success)}.pr .x svg{color:var(--icon-error)}
.pr.head{font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--text-placeholder);padding-block:10px;background:var(--bg-primary)}
.chain{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:18px}
.chain .lnk{display:grid;gap:6px;padding:12px 14px;border:1px solid var(--border-secondary);border-radius:var(--radius-lg);background:var(--bg-primary);min-width:150px}
.chain .lnk small{font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--text-placeholder)}
.chain .lnk span{display:flex;align-items:center;gap:8px;font-family:var(--mono);font-size:12px}
.chain > svg{width:18px;height:18px;color:var(--icon-tertiary)}
.legend{display:grid;gap:8px;font-size:13px;color:var(--text-secondary)}
.legend div{display:flex;gap:8px;align-items:center}
.rel{display:grid;gap:10px;font-size:13px}
.rel div{display:grid;gap:2px;padding-left:12px;border-left:2px solid var(--border-secondary)}
.rel b{font-family:var(--mono);font-size:12px}
.rel span{color:var(--text-tertiary)}
.spec-hero{display:flex;gap:24px;align-items:center;flex-wrap:wrap;padding:20px 22px}
.spec-hero .aa{font-size:72px;line-height:80px;font-weight:600;letter-spacing:-.02em}
.spec-hero .w{display:flex;gap:16px;flex-wrap:wrap;font-size:16px;color:var(--text-secondary)}
.trow{display:grid;grid-template-columns:150px minmax(0,1fr);gap:16px;padding:14px 18px;border-bottom:1px solid var(--border-secondary);align-items:center}
.trow:last-child{border-bottom:0}
.trow .meta2{display:grid;gap:2px;font-size:12px;color:var(--text-tertiary)}
.trow .meta2 b{font-size:13px;font-weight:600;color:var(--text-primary)}
.trow .meta2 code{font-family:var(--mono);font-size:11.5px;color:var(--text-brand-primary)}
.ts-sample{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--text-primary);min-width:0}
.trow.muted .ts-sample{color:var(--text-placeholder)}
.rules-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px}
.rule{background:var(--bg-white);border:1px solid var(--border-secondary);border-radius:var(--radius-xl);padding:16px 18px;display:grid;gap:6px;align-content:start}

    setTimeout(function(){S.published=clone(S.draft);S.version=nextVersion();S.releases.unshift({v:S.version.join("."),date:new Date().toLocaleDateString("en-GB",{day:"numeric",month:"short",year:"numeric"}),note:d.n+" token changes"});save();closeModal();render();
      toast({type:"success",title:"Library published",description:"v"+S.version.join(".")+" · "+d.n+" token change"+(d.n===1?"":"s")})},700)}}
function closeModal(){document.getElementById("modalRoot").innerHTML=""}

render();
})();
</script>
